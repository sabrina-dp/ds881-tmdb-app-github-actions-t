name: Build & Deploy Pipeline

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      # https://docs.expo.dev/guides/publishing-websites/?redirected#create-a-build
      # A seção do GitHub pages da docs não especifica para workflows, mas peguei o comando de lá

      - name: Build web app
        run: npx expo export -p web

      - name: Bypass Jekyll
        run: touch dist/.nojekyll

      # https://github.com/marketplace/actions/upload-github-pages-artifact

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/

  # https://github.com/marketplace/actions/deploy-github-pages-site

  deploy:
    needs: build

    # Garante ao GITHUB_TOKEN permissões para fazer deploy no pages 
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
