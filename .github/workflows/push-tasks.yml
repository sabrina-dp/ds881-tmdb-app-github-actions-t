name: Build & Deploy Pipeline

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true
 
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      # https://docs.expo.dev/guides/publishing-websites/?redirected#create-a-build
      # A seção do GitHub pages da docs não especifica para workflows, mas peguei o comando de lá

      - name: Build web app
        run: npx expo export -p web

      - name: Bypass Jekyll
        run: touch dist/.nojekyll

      # https://github.com/marketplace/actions/upload-github-pages-artifact

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/

  # https://github.com/marketplace/actions/deploy-github-pages-site

  deploy:
    name: Deploy
    needs: build

    # Garante ao GITHUB_TOKEN permissões para fazer deploy no pages 
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0


  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Set permissions for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android, deploy]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: app-release.apk
          body: "Build automático da Etapa 3. APK gerado com sucesso!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}